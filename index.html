<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohamed &amp; Nardeen — 12 December 2026</title>
  <style>
    :root {
      --ink: #141110;
      --ink-2: #1c1815;
      --bone: #efe8d9;
      --bone-dim: #d8cfba;
      --gold: #b6905a;
      --gold-soft: #9c8158;
      --hair: rgba(182, 144, 90, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--ink);
      color: var(--bone);
      font-family: "Jost", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(182, 144, 90, 0.12), transparent 36%),
        linear-gradient(180deg, var(--ink), #0d0a09 100%);
    }

    .card {
      width: min(92vw, 820px);
      padding: 48px 20px 32px;
      border: 1px solid var(--hair);
      background: rgba(20, 17, 16, 0.82);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--gold);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: 11px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 86px);
      line-height: 0.92;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    h1 span {
      color: var(--gold);
      font-style: italic;
      padding: 0 0.12em;
    }

    .subtitle {
      margin: 18px 0 0;
      color: var(--bone-dim);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .divider {
      width: 140px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 28px auto 0;
    }

    .date-block {
      margin-top: 30px;
    }

    .day {
      margin: 0;
      font-size: clamp(22px, 4vw, 40px);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--bone);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    .full {
      margin: 10px 0 0;
      color: var(--bone-dim);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .countdown {
      margin-top: 38px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
    }

    .cell {
      min-width: 92px;
      padding: 18px 12px 14px;
      border: 1px solid var(--hair);
      background: rgba(255, 255, 255, 0.02);
    }

    .num {
      display: block;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1;
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--gold);
    }

    .label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bone-dim);
    }

    .closing {
      margin-top: 34px;
      color: var(--bone-dim);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 560px) {
      .card {
        padding-top: 36px;
      }

      .countdown {
        gap: 10px;
      }

      .cell {
        min-width: 70px;
        padding: 16px 10px 12px;
      }

      .label {
        letter-spacing: 0.1em;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">The Wedding Of</p>
    <h1>Mohamed <span>~</span> Nardeen</h1>
    <p class="subtitle">Together with their families</p>

    <div class="divider"></div>

    <div class="date-block">
      <p class="day">December 2026</p>
      <p class="full">Saturday 12 December</p>
    </div>

    <div class="countdown" aria-label="Countdown to wedding day">
      <div class="cell">
        <span id="cd-d" class="num">00</span>
        <span class="label">Days</span>
      </div>
      <div class="cell">
        <span id="cd-h" class="num">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="cell">
        <span id="cd-m" class="num">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="cell">
        <span id="cd-s" class="num">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <p class="closing">With love, Mohamed &amp; Nardeen</p>
  </main>

  <script>
    const targetDate = new Date('2026-12-12T18:00:00+02:00').getTime();

    function updateCountdown() {
      const diff = Math.max(0, targetDate - Date.now());
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('cd-d').textContent = String(days).padStart(2, '0');
      document.getElementById('cd-h').textContent = String(hours).padStart(2, '0');
      document.getElementById('cd-m').textContent = String(minutes).padStart(2, '0');
      document.getElementById('cd-s').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
