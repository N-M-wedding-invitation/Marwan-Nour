<style>
:root{--ink:#141110;--bone:#efe8d9;--bone-dim:#d8cfba;--gold:#b6905a;--gold-soft:#9c8158;--hair:rgba(182,144,90,.35);--vh:100vh}

</style>

<main id="invite"><section class="section hero"><p class="kicker">The Wedding Of</p><h1 class="names">N<span class="tie">~</span>M</h1><p class="together">Together with their families</p><div class="divider"></div></section><section class="section date-block"><p class="kicker">Save The Date</p><p class="day serif">22 September 2026</p><p class="full">Tuesday · Evening</p><div class="divider"></div></section><section class="section venue"><p class="kicker">The Venue</p><h2 class="serif">Princess Garden Hall</h2><p>Damanhour, Al Beheira Governorate<br>Egypt</p><a class="cta" id="map-btn" href="#" target="_blank" rel="noopener">View Location</a><div class="divider"></div></section><section class="section countdown-block"><p class="kicker">Counting Down</p><div class="countdown"><div class="cell"><span class="num" id="cd-d">00</span><span class="lbl">Days</span></div><div class="cd-sep"></div><div class="cell"><span class="num" id="cd-h">00</span><span class="lbl">Hours</span></div><div class="cd-sep"></div><div class="cell"><span class="num" id="cd-m">00</span><span class="lbl">Minutes</span></div><div class="cd-sep"></div><div class="cell"><span class="num" id="cd-s">00</span><span class="lbl">Seconds</span></div></div></section><div class="closing"><span class="glyph">With love, N &amp; M</span></div></main>

<script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{DRACOLoader}from'three/addons/loaders/DRACOLoader.js';
const $=id=>document.getElementById(id);$('map-btn').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Princess Garden Hall, Damanhour, Al Beheira, Egypt');
const date=new Date('2026-09-22T18:00:00+02:00').getTime();function tick(){let x=Math.max(0,date-Date.now());$('cd-d').textContent=String(Math.floor(x/864e5)).padStart(2,'0');$('cd-h').textContent=String(Math.floor(x%864e5/36e5)).padStart(2,'0');$('cd-m').textContent=String(Math.floor(x%36e5/6e4)).padStart(2,'0');$('cd-s').textContent=String(Math.floor(x%6e4/1e3)).padStart(2,'0')}tick();setInterval(tick,1000);function vh(){document.documentElement.style.setProperty('--vh',innerHeight+'px')}vh();addEventListener('resize',vh);
const wrap=$('canvas-wrap'),stage=$('stage'),loaderEl=$('loader'),fill=$('lfill'),flash=$('flash'),body=document.body,scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x14110f,.045);let ready=false,opened=false,opening=false,model=null,baseScale=1;

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;wrap.appendChild(renderer.domElement);
const key=new THREE.DirectionalLight(0xf3d9a6,2.4);key.position.set(2.6,4.2,3.2);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.radius=6;key.shadow.camera.near=1;key.shadow.camera.far=12;scene.add(key);const rim=new THREE.DirectionalLight(0xb6905a,1.1);rim.position.set(-3,2,-3);scene.add(rim);scene.add(new THREE.AmbientLight(0x3a2f22,.9));const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.35}));ground.rotation.x=-Math.PI/2;ground.position.y=-1.15;ground.receiveShadow=true;scene.add(ground);const group=new THREE.Group();scene.add(group);
let mixer=null,clip=null;const draco=new DRACOLoader();draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');const gltfLoader=new GLTFLoader();gltfLoader.setDRACOLoader(draco);gltfLoader.load('./models/envelope.glb',g=>{model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});let box=new THREE.Box3().setFromObject(model),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);baseScale=2.6/(Math.max(size.x,size.y,size.z)||1);model.scale.setScalar(baseScale);model.position.sub(center.multiplyScalar(baseScale));group.add(model);if(g.animations.length){mixer=new THREE.AnimationMixer(model);clip=mixer.clipAction(g.animations.find(c=>/open/i.test(c.name))||g.animations[0]);clip.clampWhenFinished=true;clip.loop=THREE.LoopOnce}ready=true;loaderEl.classList.add('done');tune()},x=>{if(x.total)fill.style.width=Math.min(100,x.loaded/x.total*100)+'%'},e=>{console.warn(e);loaderEl.classList.add('done')});
const clock=new THREE.Clock();let idle=0,camAnim=false,ct=0,from=new THREE.Vector3(),to=new THREE.Vector3(),lift=false,lt=0;function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}function render(){requestAnimationFrame(render);let dt=clock.getDelta();idle+=dt;if(!opened&&!opening){group.position.y=Math.sin(idle*.9)*.06;group.rotation.y=Math.sin(idle*.5)*.12;group.rotation.x=Math.sin(idle*.4)*.02}if(mixer)mixer.update(dt);if(camAnim){ct+=dt/1.9;camera.position.lerpVectors(from,to,ease(Math.min(1,ct)));if(ct>=1)camAnim=false}camera.lookAt(0,-.05,0);renderer.render(scene,camera)}render();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);tune()});
const music=$('bg-music'),sound=$('sound-btn');function openEnvelope(){if(opened||opening||!ready)return;opening=true;music.play().catch(()=>{});if(clip)clip.reset().play();from.copy(camera.position);to.copy(open);ct=0;camAnim=true;setTimeout(()=>flash.classList.add('fire'),480);setTimeout(()=>{opened=true;stage.classList.add('hidden');body.classList.remove('locked');body.classList.add('unlocked');$('invite').classList.add('reveal');sound.classList.add('show')},1500)}wrap.addEventListener('click',openEnvelope);wrap.addEventListener('touchend',e=>{e.preventDefault();openEnvelope()},{passive:false});sound.addEventListener('click',()=>{if(music.paused){music.play().catch(()=>{});sound.classList.remove('muted')}else{music.pause();sound.classList.add('muted')}});stage.addEventListener('touchmove',e=>{if(body.classList.contains('locked'))e.preventDefault()},{passive:false});
